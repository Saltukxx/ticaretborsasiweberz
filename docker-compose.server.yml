services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: etb
      POSTGRES_USER: etb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - etb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etb -d etb"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: etb-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file: .env
    environment:
      TZ: Europe/Istanbul
    expose:
      - "3001"
    volumes:
      - etb_uploads:/app/uploads

  frontend:
    image: etb-frontend:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      # Kadayıf tarif videosu (~17MB) — git dışı; deploy'da /opt/etb/videos/ doldurulur
      - ./videos:/usr/share/nginx/html/videos:ro

  admin:
    image: etb-admin:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  etb_pgdata:
  etb_uploads:
